name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access to the repository.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test tests/Workspace.UnitTests/Workspace.UnitTests.csproj
          --configuration Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        # Each test run creates and drops its own database on this server.
        env:
          WORKSPACE_TEST_POSTGRES: Host=localhost;Port=5432;Username=workspace;Password=workspace-ci-password;Database=postgres
        run: >-
          dotnet test tests/Workspace.IntegrationTests/Workspace.IntegrationTests.csproj
          --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Build (web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate the Compose file
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
          JWT_SIGNING_KEY: ci-placeholder-signing-key-at-least-32-chars

      - name: Build API image
        run: docker build --file docker/api.Dockerfile --tag workspace-api:ci .

      - name: Build worker image
        run: docker build --file docker/worker.Dockerfile --tag workspace-worker:ci .

      - name: Build web image
        run: docker build --file docker/web.Dockerfile --tag workspace-web:ci .
