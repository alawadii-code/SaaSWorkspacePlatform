# Serves the built frontend and proxies the API under the same origin.
#
# Same-origin matters: the refresh token is a SameSite cookie, and routing
# /api through here means the browser treats it as first-party. It also means
# no CORS configuration is needed in this deployment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the upstream's identity and this server's version.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The SPA shell must not be cached, or a deploy leaves clients on an old
    # bundle; the hashed assets under /assets are immutable and cached hard.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a slow query, short enough to fail visibly.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # API documentation, served by the API itself.
    location /docs {
        proxy_pass http://api:8080/docs;
    }

    location /openapi/ {
        proxy_pass http://api:8080/openapi/;
    }

    # Client-side routing: unknown paths return the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
